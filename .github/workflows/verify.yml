name: Verify
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r workers/requirements.txt
      - run: npm run setup:browser
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run schemas
      - run: git diff --exit-code -- packages/contracts/schemas
